<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Servidor a Arrancar - Gestor Naval Pro</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .container {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 40px 30px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      max-width: 450px;
      width: 100%;
    }
    .icon {
      font-size: 64px;
      margin-bottom: 20px;
      animation: pulse 2s infinite ease-in-out;
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      margin: 0 0 10px 0;
      letter-spacing: -0.02em;
    }
    p {
      color: #94a3b8;
      font-size: 15px;
      line-height: 1.6;
      margin: 0 0 25px 0;
    }
    .btn {
      display: inline-block;
      background: #3b82f6;
      color: white;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      transition: background 0.2s, transform 0.1s;
      border: none;
      cursor: pointer;
    }
    .btn:hover { background: #2563eb; }
    .btn:active { transform: scale(0.98); }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .hint {
      color: #64748b;
      font-size: 12px;
      margin-top: 18px;
    }
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(59,130,246,0.3);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status-line {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 12px;
      min-height: 20px;
    }
    .status-ok { color: #22c55e; }
    .status-err { color: #ef4444; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">⚓</div>
    <h1>Servidor a Arrancar</h1>
    <p>
      O servidor local ainda nao esta pronto. Isto e normal ao iniciar a aplicacao.
      A pagina ira atualizar automaticamente quando o servidor estiver disponivel.
    </p>
    <p id="status" class="status-line">
      <span class="spinner"></span> A aguardar servidor...
    </p>
    <button class="btn" onclick="forceCheck()">Tentar Agora</button>
  </div>
  <script>
    (function () {
      var tries = 0;
      var MAX_TRIES = 120; // 6 minutos (a cada 3s)
      var STATUS_EL = document.getElementById('status');

      function setStatus(text, cls) {
        if (STATUS_EL) {
          STATUS_EL.innerHTML = text;
          STATUS_EL.className = cls || 'status-line';
        }
      }

      function checkServer() {
        tries++;
        if (tries > MAX_TRIES) {
          setStatus('Servidor nao respondeu. Verifique se o INICIAR.bat esta a correr.', 'status-err');
          return;
        }

        setStatus('<span class="spinner"></span> Tentativa ' + tries + '...');

        var xhr = new XMLHttpRequest();
        xhr.timeout = 3000;
        xhr.onload = function () {
          if (xhr.status >= 200 && xhr.status < 400) {
            setStatus('Servidor pronto! A redirecionar...', 'status-ok');
            // Dar tempo para o service worker atualizar o cache
            setTimeout(function () { window.location.reload(); }, 500);
          } else {
            setTimeout(checkServer, 3000);
          }
        };
        xhr.onerror = function () { setTimeout(checkServer, 3000); };
        xhr.ontimeout = function () { setTimeout(checkServer, 3000); };
        xhr.open('GET', '/api/health', true);
        xhr.send();
      }

      // Auto-start apos 2 segundos
      setTimeout(checkServer, 2000);

      // Expor para o botao
      window.forceCheck = function () {
        tries = 0;
        checkServer();
      };
    })();
  </script>
</body>
</html>
