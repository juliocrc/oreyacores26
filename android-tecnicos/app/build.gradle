plugins {
    id 'com.android.application'
    id 'io.sentry.android.gradle'
}
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

// Perfil de estaÃ§Ã£o opcional. O mesmo cÃ³digo gera um APK por estaÃ§Ã£o:
// gradle assembleDebug -PstationSlug=lisboa -PstationId=2 -PstationCode=LISBOA ...
def stationSlug = (project.findProperty("stationSlug") ?: "").toString().trim()
def stationId = (project.findProperty("stationId") ?: "0").toString().trim()
def stationCode = (project.findProperty("stationCode") ?: "").toString().trim()
def stationName = (project.findProperty("stationName") ?: "").toString().trim()
def stationServerUrl = (project.findProperty("stationServerUrl") ?: "").toString().trim()
def stationBuild = !stationSlug.isEmpty() && stationId != "0" && !stationCode.isEmpty()
def stationKey = stationSlug.replaceAll("[^a-zA-Z0-9]", "").toLowerCase()
if (stationBuild && stationKey.isEmpty()) {
    throw new GradleException("stationSlug invÃ¡lido: ${stationSlug}")
}
def stationLabelName = stationName ?: stationCode
def displayStationLabel = stationLabelName.replaceAll("(?i)acores", "Açores")
def appLabel = stationBuild ? "Orey Técnicos – ${displayStationLabel}" : "Orey Técnicos"
def appId = stationBuild ? "pt.oreyacores.tecnicos.${stationKey}" : "pt.oreyacores.tecnicos"
def gstr = { value -> '"' + value.toString().replace('\\', '\\\\').replace('"', '\\"') + '"' }

// Assinatura de release opcional: criar android-tecnicos/keystore.properties com
// storeFile, storePassword, keyAlias e keyPassword. Sem este ficheiro, o build
// release usa a chave de debug (serve para testes, nÃ£o para distribuiÃ§Ã£o).
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
def hasReleaseSigning = keystorePropsFile.exists()
if (hasReleaseSigning) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'pt.oreyacores.tecnicos'
    compileSdk 36
    buildToolsVersion '36.1.0'
    defaultConfig {
        applicationId appId
        minSdk 24
        targetSdk 36
        versionCode 5
        versionName '2.3'
        resValue "string", "app_name", appLabel
        buildConfigField "boolean", "STATION_BUILD", stationBuild.toString()
        buildConfigField "int", "STATION_ID", stationId ?: "0"
        buildConfigField "String", "STATION_CODE", gstr(stationCode)
        buildConfigField "String", "STATION_NAME", gstr(stationName)
        buildConfigField "String", "STATION_SERVER_URL", gstr(stationServerUrl)
        buildConfigField "String", "STATION_SLUG", gstr(stationKey)
    }
    buildFeatures {
        buildConfig true
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(keystoreProps.getProperty("storeFile"))
                storePassword keystoreProps.getProperty("storePassword")
                keyAlias keystoreProps.getProperty("keyAlias")
                keyPassword keystoreProps.getProperty("keyPassword")
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations.all {
    resolutionStrategy {
        // O ML Kit traz kotlin-stdlib-jdk7/jdk8 antigos que duplicam classes
        // da kotlin-stdlib atual. Alinhamos todos na mesma versÃ£o.
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'com.google.android.material:material:1.12.0'
    // OCR no dispositivo: fotografias de certificados/quadros sem enviar a imagem
    // para serviÃ§os externos. O modelo Latin estÃ¡ incluÃ­do no APK.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    // Scanner QR (ML Kit + CameraX)
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    // PersistÃªncia offline + sincronizaÃ§Ã£o
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    implementation 'androidx.work:work-runtime:2.9.1'
    // SeguranÃ§a
    implementation 'com.google.android.play:integrity:1.3.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // LocalizaÃ§Ã£o (GPS nas fotos)
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    // Firebase (anÃ¡lises, push, config remota, performance)
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-config'
    implementation 'com.google.firebase:firebase-perf'
    // MonitorizaÃ§Ã£o de erros
    implementation 'io.sentry:sentry-android:7.18.0'
}

