# Render Blueprint for Gestão Naval Pro
# Deploys a Node.js web service using PostgreSQL Atlas.
# Usage: push this file to GitHub and create a new Blueprint on Render.
# Set DATABASE_URL in Render Dashboard > Environment (PostgreSQL Atlas connection string).

services:
  - type: web
    name: gestor-naval-pro
    runtime: node
    plan: standard
    branch: main
    buildCommand: "chmod +x scripts/render-build.sh && ./scripts/render-build.sh"
    startCommand: "node .next/standalone/server.js"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOSTNAME
        value: 0.0.0.0
      - key: PORT
        value: 3000
      - key: SUPABASE_DATABASE_URL
        sync: false
        value: "postgres://postgres:SUA_SENHA_AQUI@db.seu-projeto.supabase.co:5432/postgres?sslmode=require"
      - key: DATABASE_URL
        sync: false
        value: "postgres://postgres:SUA_SENHA_AQUI@db.seu-projeto.supabase.co:5432/postgres?sslmode=require"
      - key: AUTH_BYPASS
        value: "true"
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        value: https://gestor-naval-pro.onrender.com
      # Optional: set your own app name / domain below
      # - key: NEXT_PUBLIC_APP_NAME
      #   value: Gestão Naval Pro
