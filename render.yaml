# Render Blueprint for Gestor Naval Pro
# Deploys a PostgreSQL database and a Node.js web service.
# Usage: push this file to GitHub and create a new Blueprint on Render.

services:
  - type: web
    name: gestor-naval-pro
    runtime: node
    plan: standard
    branch: main
    buildCommand: "chmod +x scripts/render-build.sh && ./scripts/render-build.sh"
    startCommand: "node .next/standalone/server.js"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOSTNAME
        value: 0.0.0.0
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: gestor-naval-pro-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        value: https://gestor-naval-pro.onrender.com
      # Optional: set your own app name / domain below
      # - key: NEXT_PUBLIC_APP_NAME
      #   value: Gestor Naval Pro

databases:
  - name: gestor-naval-pro-db
    plan: starter
    region: frankfurt
    ipAllowList: []
