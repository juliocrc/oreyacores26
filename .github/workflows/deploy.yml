name: CI / Deploy to Vercel

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Generate PostgreSQL Prisma client and build
        run: npm run build:vercel
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Necessario apenas no build (o Next recolhe page data e o Auth.js exige o
          # segredo em production). Este .next e descartado - a Vercel rebui-la com as
          # suas proprias env reais.
          NEXTAUTH_SECRET: "ci-build-only-placeholder-do-not-use"
          NEXTAUTH_URL: "https://oreyacoresdeluxe.vercel.app"

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v42
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./
          vercel-args: '--prod'

      - name: Post-deploy smoke test
        run: |
          echo "Deployment finished. You can run smoke tests here (optional)."
