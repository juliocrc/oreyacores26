name: CI & E2E Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build application
        run: npm run build:vercel
        env:
          DATABASE_URL: "postgresql://postgres:dummy@localhost:5432/postgres"
          # Necessario apenas no build (o Next recolhe page data e o Auth.js exige o
          # segredo em production). Este .next e descartado - a Vercel rebui-la com as
          # suas proprias env reais.
          NEXTAUTH_SECRET: "ci-build-only-placeholder-do-not-use"
          NEXTAUTH_URL: "https://oreyacoresdeluxe.vercel.app"

      - name: Run unit tests
        run: npm test
