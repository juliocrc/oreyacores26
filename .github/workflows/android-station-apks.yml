name: Android station APKs

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Gerar release (assinado so se os secrets do keystore existirem)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "android-tecnicos/**"
      - "android-clientes/**"
      - "stations/**"
      - "scripts/build-station-apks.ps1"
      - "scripts/package-station-apks.ps1"
      - ".github/workflows/android-station-apks.yml"

permissions:
  contents: read

concurrency:
  group: android-station-apks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.1.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.6"

      # Opcional: assinatura de release. Definir o secret
      # ANDROID_KEYSTORE_BASE64 com o orey-release.jks em base64, e
      # ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
      - name: Restore release keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > orey-release.jks
          for dir in android-tecnicos android-clientes; do
            {
              echo "storeFile=../orey-release.jks"
              echo "storePassword=$STORE_PASS"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASS"
            } > "$dir/keystore.properties"
          done

      - name: Build station APKs
        shell: pwsh
        run: |
          $release = "${{ inputs.release }}"
          $signed = Test-Path "android-clientes/keystore.properties"
          if ($release -eq "true" -or $signed) {
            ./scripts/build-station-apks.ps1 -App both -Release
            ./scripts/package-station-apks.ps1
          } else {
            ./scripts/build-station-apks.ps1 -App both
            ./scripts/package-station-apks.ps1
          }

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: orey-station-apks
          path: |
            dist/estacoes/**/*.apk
            dist/estacoes/**/LEIA-ME.txt
            dist/estacoes/**/estacao.json
            dist/estacoes/INDICE.md
          retention-days: 30
          if-no-files-found: error

      - name: Upload ZIP packages
        uses: actions/upload-artifact@v4
        with:
          name: orey-station-zips
          path: dist/estacoes/*.zip
          retention-days: 30
          if-no-files-found: warn
